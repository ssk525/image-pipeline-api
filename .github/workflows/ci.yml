name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python run_benchmark.py --repeats 1

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compose up, health check, benchmark over HTTP
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do curl -sf localhost:8000/health && break; sleep 2; done
          pip install -q numpy opencv-python-headless httpx pydantic-settings fastapi
          python run_benchmark.py --url http://localhost:8000 --repeats 1
          docker compose down
